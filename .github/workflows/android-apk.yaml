name: Android APK CI

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      artifact_name:
        description: APK artifact name
        required: false
        default: app-release-apk

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  packages: write
  pull-requests: write
  security-events: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set_environment:
    name: Set
    uses: DigitalDreamsInc/workflows/.github/workflows/set-environment.yaml@master
    with:
      ref: ${{ github.ref }}
    secrets: inherit

  analyze_code:
    name: Analyze
    needs: [set_environment]
    uses: DigitalDreamsInc/workflows/.github/workflows/code-analysis.yaml@master
    with:
      default_branch: ${{ github.event.repository.default_branch }}
      push_before_sha: ${{ github.event.before }}
      push_base_sha: ${{ github.event.base_ref }}
    secrets: inherit

  analyze_deps:
    name: Analyze
    needs: [set_environment]
    uses: DigitalDreamsInc/workflows/.github/workflows/deps-analysis.yaml@master
    with:
      continue-on-error: true
    secrets: inherit

  build_apk:
    name: Build
    needs: [set_environment, analyze_deps, analyze_code]
    uses: DigitalDreamsInc/workflows/.github/workflows/expo-build-apk.yaml@master
    with:
      environment: ${{ needs.set_environment.outputs.environment }}
      runner: '["self-hosted"]'
      artifact_name: ${{ github.event.inputs.artifact_name || 'app-release-apk' }}
      gradle_init_script: ../scripts/gradle-ci.init.gradle
    secrets: inherit

  release:
    name: Release
    needs: [build_apk]
    uses: cabrera-evil/workflows/.github/workflows/semantic-release.yaml@master
    with:
      artifact_name: ${{ needs.build_apk.outputs.artifact_name }}
    secrets: inherit
